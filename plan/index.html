<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Agent 学习进度看板</title>
    <link rel="icon" href="/img/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <div class="texture"></div>
      <div class="code-rain" id="codeRain"></div>
      <div class="top-beam"></div>
    </div>

    <header class="topbar glass-pill">
      <a class="brand" href="https://pdxstudio.top/">
        <span class="brand-mark">
          <img src="/img/favicon.ico" alt="" />
        </span>
        <span id="brandText">Agent 学习进度</span>
      </a>

      <label class="search-box" id="searchBox" aria-label="搜索课程">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="searchInput" type="search" placeholder="搜索 LangGraph / RAG / FastAPI..." />
      </label>

      <div class="top-actions">
        <a class="chip handbook-link" href="./summer-project.html" title="打开暑假项目手册">
		<span>项目手册</span>
        </a>
        <button class="chip active" data-filter="all" id="filterAllText" type="button">全部</button>
        <button class="chip" data-filter="todo" id="filterTodoText" type="button">未完成</button>
        <button class="chip" data-filter="done" id="filterDoneText" type="button">已完成</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar glass-panel">
        <div class="side-title">
          <span id="sideTitleText">路线导航</span>
          <strong id="sideProgress">0%</strong>
        </div>
        <div class="side-progress">
          <span id="sideProgressBar"></span>
        </div>
        <nav id="sideNav" class="side-nav" aria-label="学习阶段导航"></nav>
      </aside>

      <section class="content">
        <section class="dashboard">
          <article class="hero-panel glass-panel">
            <div>
              <p class="eyebrow" id="heroEyebrowText">AI Agent Engineer Roadmap</p>
              <h1 id="heroTitleText">学习路线</h1>
              <p id="heroDescText">我的Agent学习路线</p>
            </div>
            <div class="focus-card">
              <span id="focusLabelText">主要知识学习路线</span>
              <strong id="focusValueText">LangChain + RAG → FastAPI → LangGraph + Agent</strong>
              <small id="focusCaptionText">学习路线</small>
            </div>
          </article>

          <div class="stats-grid">
            <article class="stat-card glass-card">
              <span id="overallLabelText">总进度</span>
              <strong id="overallPercent">0%</strong>
              <div class="mini-bar"><i id="overallBar"></i></div>
            </article>
            <article class="stat-card glass-card">
              <span id="doneLabelText">已完成</span>
              <strong id="doneCount">0</strong>
              <small id="doneCaptionText">个学习项</small>
            </article>
            <article class="stat-card glass-card">
              <span id="todoLabelText">剩余</span>
              <strong id="todoCount">0</strong>
              <small id="todoCaptionText">个学习项</small>
            </article>
          </div>
        </section>

        <section id="moduleList" class="module-list" aria-label="详细学习路线"></section>
      </section>
    </main>

    <div class="modal-backdrop" id="detailModal" aria-hidden="true">
      <section class="detail-modal glass-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭课程清单">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <div class="modal-head">
          <span id="modalPhase">阶段</span>
          <h2 id="modalTitle">课程清单</h2>
          <p id="modalDesc"></p>
          <div class="modal-progress">
            <i id="modalProgressBar"></i>
          </div>
          <small id="modalProgressText">0/0</small>
        </div>
        <div class="detail-list" id="detailList"></div>
      </section>
    </div>

    <script src="./script.js"></script>
  <script src="/site-status.js?v=20261120" defer></script>
</body>
</html>
